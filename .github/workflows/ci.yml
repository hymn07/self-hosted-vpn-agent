name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install --requirement requirements-dev.txt
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Static and configuration tests
        run: bash tests/test_static.sh
      - name: Verify patches against exact upstream
        run: bash tests/test_patches.sh
